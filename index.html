<!DOCTYPE html>
<html>
<head>
<title>For Ivy ❤️</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>

<style>
body{
background:#1a0b1a;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
overflow:hidden;
color:white;
text-align:center;
}

/* FLOATING HEARTS */
.heart{
position:fixed;
bottom:-20px;
font-size:20px;
animation:floatUp linear forwards;
opacity:.8;
}

@keyframes floatUp{
to{
transform:translateY(-110vh);
opacity:0;
}
}

.container{
background:rgba(30,10,25,.8);
padding:30px;
border-radius:25px;
max-width:600px;
box-shadow:0 0 40px hotpink;
}

.btn{
padding:14px 26px;
border-radius:50px;
border:none;
font-size:18px;
cursor:pointer;
margin:5px;
transition:.25s;
}

.btn:hover{
transform:scale(1.1);
}

.btn-yes{background:#ff4d6d;color:white;}
.btn-maybe{background:#c77dff;}
.btn-no{background:#555;}

#response{
margin-top:20px;
font-size:22px;
min-height:50px;
}
</style>
</head>

<body>

<!-- BACKGROUND MUSIC -->
<audio id="bgmusic" loop>
<source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
</audio>

<div class="container">
<h1>Will you be my girlfriend?</h1>

<p>
Hey Ivy ❤️<br><br>
Getting to know you has honestly been one of
the best things that's happened to me.<br><br>
So I wanted to ask...
</p>

<button class="btn btn-yes" onclick="answer('yes')">
YES ❤️
</button>

<button class="btn btn-maybe" onclick="answer('maybe')">
Hmmm
</button>

<button id="noBtn" class="btn btn-no">
NO
</button>

<div id="response"></div>
</div>

<script>

/* ===============================
PRIVATE LINK CHECK
=============================== */
const params=new URLSearchParams(window.location.search);
if(params.get("ivy")!=="yes"){
document.body.innerHTML="<h1>🚫 Private Page</h1>";
throw new Error("Blocked");
}

/* ===============================
ANSWER LOCK
=============================== */
let answered=false;

/* ===============================
BACKGROUND MUSIC FADE IN
=============================== */
function startMusic(){
let music=document.getElementById("bgmusic");
music.volume=0;
music.play();

let vol=0;
let fade=setInterval(()=>{
vol+=0.02;
music.volume=vol;
if(vol>=0.3)clearInterval(fade);
},200);
}

document.body.addEventListener("click",startMusic,{once:true});

/* ===============================
FLOATING HEARTS
=============================== */
setInterval(()=>{
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(4+Math.random()*4)+"s";
document.body.appendChild(heart);

setTimeout(()=>heart.remove(),8000);
},400);

/* ===============================
RUNAWAY NO BUTTON
=============================== */
const noBtn=document.getElementById("noBtn");

function moveButton(){
noBtn.style.position="absolute";
noBtn.style.left=Math.random()*80+"vw";
noBtn.style.top=Math.random()*80+"vh";
}

noBtn.addEventListener("mouseover",moveButton);
noBtn.addEventListener("touchstart",moveButton);

/* ===============================
CONFETTI
=============================== */
function celebrate(){
confetti({particleCount:150,spread:80,origin:{y:.6}});
}

/* ===============================
ANSWER FUNCTION
=============================== */
function answer(type){

if(answered) return;
answered=true;

let r=document.getElementById("response");

if(type==="yes"){
r.innerHTML="You just made me the happiest person alive ❤️";
celebrate();
}
else if(type==="maybe"){
r.innerHTML="That's okay… I'll wait for you ❤️";
}
}

</script>
</body>
</html>
