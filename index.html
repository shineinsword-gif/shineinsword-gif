<!DOCTYPE html>
<html>
<head>
<title>For Ivy</title>
<meta charset="utf-8">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>

<style>
body {
    background: url('flowers.jpg') no-repeat center center fixed;
    background-size: cover;
    background-color: #1a0b1a;
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    color:white;
    text-align:center;
}

.container{
    background: rgba(30,10,25,0.75);
    padding:35px;
    border-radius:30px;
    backdrop-filter:blur(2px);
    max-width:650px;
    border:2px solid rgba(255,182,193,0.6);
    box-shadow:0 0 40px rgba(255,105,180,0.4);
}

h1{
    font-size:48px;
    margin-bottom:20px;
    text-shadow:2px 2px 15px #ff69b4;
}

.subheadline{
    font-size:20px;
    line-height:1.6;
    margin-bottom:30px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    padding:14px 28px;
    border:none;
    border-radius:60px;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
    border:2px solid rgba(255,255,255,0.5);
    transition:.3s;
}

.btn:hover{
    transform:scale(1.1);
}

.btn-yes{
    background:#ff4d6d;
    color:white;
}

.btn-hmm{
    background:#c77dff;
    color:#2d0a3b;
}

.btn-no{
    background:#b57edc;
    color:#1e0b26;
}

#response{
    margin-top:30px;
    font-size:24px;
    font-weight:bold;
    min-height:60px;
}

.face{
    font-size:70px;
}
audio{display:none;}
</style>
</head>

<body>

<!-- AUDIO -->
<audio id="celebration-sound">
<source src="yes.mp3" type="audio/mpeg">
</audio>

<audio id="sad-piano-sound">
<source src="maybe.mp3" type="audio/mpeg">
</audio>

<audio id="boing-sound">
<source src="no.mp3" type="audio/mpeg">
</audio>

<div class="container">

<div class="face">(◕‿◕✿)</div>

<h1>Will you be my girlfriend?</h1>

<div class="subheadline">
Hey Ivy,<br><br>
I've liked you from the moment we met.<br>
Getting to know you was one of the best things<br>
that's happened to me all year.<br><br>
I was wondering if you would be my girlfriend?
</div>

<div class="buttons">
<button onclick="showResponse('yes')" class="btn btn-yes">YES! ❤️</button>

<button onclick="showResponse('hmm')" class="btn btn-hmm">
Hmm 🤔
</button>

<button onclick="showResponse('no')" class="btn btn-no">NO!</button>
</div>

<div id="response"></div>

</div>

<script>

/* Unlock audio on first click (mobile fix) */
document.body.addEventListener("click",()=>{
document.querySelectorAll("audio").forEach(a=>{
a.volume=0;
a.play().then(()=>{
a.pause();
a.currentTime=0;
}).catch(()=>{});
});
},{once:true});

function playSound(id,vol){
let a=document.getElementById(id);
a.pause();
a.currentTime=0;
a.volume=vol;
a.play().catch(()=>{});
}

function celebrateYes(){
playSound("celebration-sound",0.2);

confetti({
particleCount:150,
spread:80,
origin:{y:0.6}
});
}

function sadTears(){
playSound("sad-piano-sound",0.15);

confetti({
particleCount:40,
angle:90,
spread:20,
gravity:1.8,
origin:{y:0.2}
});
}

function ashes(){
playSound("boing-sound",0.12);

confetti({
particleCount:30,
spread:40,
colors:['#555','#888']
});
}

function showResponse(answer){

if(answer==="yes"){
document.getElementById("response").innerHTML=
"^^ Yay! You just made my whole year! ❤️";
celebrateYes();
}

else if(answer==="hmm"){
document.getElementById("response").innerHTML=
"Hmm... I'll take that as hope ❤️ Take your time.";
sadTears();
}

else if(answer==="no"){
document.getElementById("response").innerHTML=
"Ouch... my heart 😭 but I respect it ❤️";
ashes();
}
}
</script>

</body>
</html>
