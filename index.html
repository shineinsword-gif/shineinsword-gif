<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:black;
  color:white;
  font-family:Georgia, serif;
  overflow:hidden;
}

#overlay {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:black;
  cursor:pointer;
  font-size:2rem;
  text-align:center;
}

.fade {
  animation: fadeIn 3s forwards;
}

@keyframes fadeIn {
  from {opacity:0;}
  to {opacity:1;}
}

.message {
  opacity:0;
  font-size:2rem;
  text-align:center;
}
</style>
</head>

<body>

<div id="overlay">
  ✨ Click Anywhere ✨<br>
  to Begin
</div>

<div class="message" id="text">
  You are the most beautiful part of my world.
</div>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const overlay = document.getElementById("overlay");
const music = document.getElementById("music");
const text = document.getElementById("text");

overlay.addEventListener("click", () => {
  music.play();

  overlay.style.display = "none";

  setTimeout(()=>{
    text.classList.add("fade");
  },1000);
});
</script>

</body>
</html>
