<script>

/* ===============================
PRIVATE LINK
=============================== */
const params=new URLSearchParams(window.location.search);
if(params.get("ivy")!=="yes"){
document.body.innerHTML="<h1 style='color:white'>Private Page ❤️</h1>";
throw new Error("Blocked");
}

/* ===============================
CINEMATIC FADE IN
=============================== */
document.body.style.opacity="0";
setTimeout(()=>{
document.body.style.transition="opacity 2s";
document.body.style.opacity="1";
},200);

/* ===============================
MUSIC + HEARTBEAT
=============================== */
let musicStarted=false;

function startMusic(){
if(musicStarted) return;
musicStarted=true;

const music=document.getElementById("bgmusic");
music.volume=0.01;

music.play();

let v=0.01;
let fade=setInterval(()=>{
v+=0.015;
music.volume=v;
if(v>=0.35) clearInterval(fade);
},200);
}

document.addEventListener("click",startMusic);
document.addEventListener("touchstart",startMusic);

/* ===============================
FLOATING HEARTS
=============================== */
setInterval(()=>{
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(5+Math.random()*4)+"s";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),9000);
},500);

/* ===============================
RUNAWAY NO BUTTON
=============================== */
const noBtn=document.getElementById("noBtn");

function escape(){
noBtn.style.position="absolute";
noBtn.style.left=Math.random()*80+"vw";
noBtn.style.top=Math.random()*80+"vh";
}

noBtn.addEventListener("mouseover",escape);
noBtn.addEventListener("touchstart",escape);

/* ===============================
ANSWER LOCK
=============================== */
let answered=false;

/* ===============================
HEARTBEAT SOUND
=============================== */
const heartbeat=new Audio(
"https://www.soundjay.com/human/sounds/heartbeat-01a.mp3"
);

/* ===============================
CINEMATIC YES MOMENT
=============================== */
function cinematicYes(){

heartbeat.volume=.4;
heartbeat.play();

/* screen glow */
document.body.style.transition="1.5s";
document.body.style.background="#ff9acb";

/* slow confetti waves */
let count=0;
let interval=setInterval(()=>{
confetti({
particleCount:80,
spread:70,
origin:{y:.6}
});
count++;
if(count>6) clearInterval(interval);
},400);

/* zoom effect */
document.querySelector(".container")
.style.transform="scale(1.08)";

/* LOVE LETTER REVEAL */
setTimeout(()=>{
document.getElementById("response").innerHTML=
`
<h2>❤️ You said YES ❤️</h2>
<p>
I promise to make you smile,
laugh, and feel loved every day.<br><br>
This is just the beginning of
something beautiful with you.
</p>
`;
},2500);
}

/* ===============================
MAIN ANSWER
=============================== */
function answer(type){

if(answered) return;
answered=true;

if(type==="yes"){
cinematicYes();
}
else if(type==="maybe"){
document.getElementById("response")
.innerHTML="I'll wait for you ❤️";
}
}

</script>
